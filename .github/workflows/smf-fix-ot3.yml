name: SMF fix OT 3
on:
  push:
    paths:
      - .github/workflows/smf-fix-ot3.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          helper='''<script>\n(function(){\nfunction smfToast(m){var t=document.getElementById("smfToast");if(!t){t=document.createElement("div");t.id="smfToast";t.style.cssText="position:fixed;right:22px;bottom:22px;z-index:99999;background:#15803d;color:#fff;padding:14px 18px;border-radius:10px;font-weight:800;box-shadow:0 8px 30px #0004";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(window.__smfToastTimer);window.__smfToastTimer=setTimeout(function(){t.style.display="none"},2800)}\nwindow.smfReturnDiagnosisToNew=function(){var n=(document.getElementById("smfReturnOTNumber")||{}).value||"";n=n.trim();if(!n){alert("Ingrese el número de OT.");return}var o=(window.db&&db.orders||[]).find(function(x){return String(x.orderNumber||"")===n});if(!o){alert("No se encontró la OT #"+n+".");return}if(!confirm("¿Regresar la OT #"+n+" a Nueva Orden? Se conservarán el cliente y el vehículo para corregir el ingreso."))return;o.workflowStage="nuevaOrden";o.status="Nueva orden";o.diagnosisOnly=false;delete o.diagnosis;delete o.diagnosisAt;delete o.diagnosisTechnicianId;delete o.diagnosisTechnicianName;if(typeof save==="function")save();smfToast("OT #"+n+" regresada a Nueva Orden");if(typeof show==="function")show("orden");};\ndocument.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;var oc=b.getAttribute("onclick")||"";if(!/createOrder\s*\(/i.test(oc))return;if(b.dataset.smfBusy==="1"){e.preventDefault();return}var before=(window.db&&db.orders||[]).length;setTimeout(function(){var after=(window.db&&db.orders||[]).length;if(after>before){smfToast("✅ OT creada con éxito");b.dataset.smfBusy="1";b.disabled=true;setTimeout(function(){b.disabled=false;b.dataset.smfBusy=""},1200)}},120)},false);\n})();</script>'''
          if 'id="smfToast"' not in s:
              if '</body>' not in s: raise SystemExit('No se encontró cierre BODY')
              s=s.replace('</body>',helper+'\n</body>',1)
          if 'id="smfDiagnosisReturnPanel"' not in s:
              marker='<section id="tecnico" class="view">'
              if marker not in s: raise SystemExit('No se encontró sección tecnico')
              panel='''<div id="smfDiagnosisReturnPanel" class="card" style="border-left:4px solid #b45309"><h3>↩ Corregir ingreso de OT</h3><p class="muted">Si una OT fue ingresada incorrectamente, regresala a Nueva Orden para corregir el ingreso.</p><div class="actions"><input id="smfReturnOTNumber" placeholder="Número de OT" style="max-width:220px"><button class="secondary" onclick="smfReturnDiagnosisToNew()">↩ Regresar a Nueva Orden</button></div></div>'''
              s=s.replace(marker,marker+panel,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/smf-fix-ot.yml .github/workflows/smf-fix-ot2.yml .github/workflows/smf-debug-ot.yml .github/workflows/smf-debug-ot2.yml .github/workflows/smf-fix-ot3.yml
          git rm -f .github/workflows/smf-fix-ot.yml .github/workflows/smf-fix-ot2.yml .github/workflows/smf-debug-ot.yml .github/workflows/smf-debug-ot2.yml .github/workflows/smf-fix-ot3.yml
          git commit -m "Agregar confirmacion de OT y regreso a Nueva Orden"
          git push