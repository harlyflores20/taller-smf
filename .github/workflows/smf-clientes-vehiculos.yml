tiv-G",2013,2026],["2.2L Skyactiv-D",2013,2020]],\n  "Volkswagen|Amarok":[["2.0L TDI",2010,2022],["3.0L TDI V6",2016,2022],["2.0L TDI BiTurbo",2010,2022]],\n  "Volkswagen|Jetta":[["2.0L MPI",2011,2018],["1.4L TSI",2016,2026],["1.8L TSI",2011,2018],["2.0L TSI",2011,2026]],\n  "BMW|3 Series":[["2.0L B48 Turbo",2016,2026],["3.0L B58 Turbo",2016,2026]],\n  "Mercedes-Benz|Sprinter":[["2.1L OM651 Diesel",2009,2018],["3.0L OM642 Diesel",2007,2018],["2.0L OM654 Diesel",2019,2026]],\n  "Isuzu|D-Max":[["2.5L 4JK1 Diesel",2008,2016],["3.0L 4JJ1 Diesel",2008,2020],["1.9L RZ4E Diesel",2017,2026]],\n  "Changan|Hunter":[["1.9L Diesel",2019,2026],["2.0L Turbo Diesel",2021,2026]],\n  "JAC|T8":[["2.0L Turbo Diesel",2018,2026],["2.4L Gasoline",2018,2026]],\n  "Great Wall|Wingle 5":[["2.0L Turbo Diesel",2006,2020],["2.4L Gasoline",2006,2018]],\n  "BYD|Song Plus":[["1.5L Turbo Plug-in Hybrid",2021,2026],["Electric",2021,2026]],\n  "MG|ZS":[["1.5L VTi",2017,2026],["1.0L Turbo",2019,2026],["Electric",2019,2026]]\n};\nfunction engineData(make,model,year){\n const list=vehicleEngineCatalog[make+"|"+model]||[]; const y=Number(year||0); return list.filter(function(x){return !y||y>=x[1]&&y<=x[2];});\n}\n'''
              s=s.replace(marker,extra+marker,1)
              # Make the existing model lookup include the expanded catalog and manual option support.
              s=s.replace(marker,'function modelData(make){return vehicleCatalog[make]||[];}\nfunction addManualOption(selectId,label){const el=document.getElementById(selectId);if(el&&!Array.from(el.options).some(o=>o.value==="__manual__")){el.insertAdjacentHTML("beforeend",\'<option value="__manual__">\'+label+\' / escribir manualmente</option>\');}}\nfunction fieldValue(selectId,manualId){const el=document.getElementById(selectId),m=document.getElementById(manualId);return el&&el.value==="__manual__"&&m?m.value.trim():(el?el.value.trim():"");}\nfunction ensureVehicleManualFields(prefix){\n const specs=[["Make","Marca manual"],["Model","Modelo manual"],["Year","Año manual"],["Engine","Motor manual"]];\n specs.forEach(function(x){const id=prefix+x[0],mid=prefix+x[0]+"Manual",el=document.getElementById(id);if(!el||document.getElementById(mid))return;addManualOption(id,x[1].replace(" manual",""));const wrap=document.createElement("div");wrap.id=mid+"Wrap";wrap.style.display="none";wrap.innerHTML=\'<label>\'+x[1]+\'</label><input id="\'+mid+\'" placeholder="Escriba el dato...">\';el.parentElement.appendChild(wrap);el.addEventListener("change",function(){wrap.style.display=el.value==="__manual__"?"block":"none";});});\n}\nfunction populateVehicleEngines(makeId,modelId,yearId,engineId,manualId,preserve=\"\"){const make=fieldValue(makeId,makeId+"Manual"),model=fieldValue(modelId,modelId+"Manual"),year=fieldValue(yearId,yearId+"Manual"),el=document.getElementById(engineId);if(!el)return;ensureVehicleManualFields(engineId.replace("Engine",""));const list=engineData(make,model,year);el.innerHTML=\'<option value="">Seleccione motor...</option>\'+list.map(x=>\'<option value="\'+esc(x[0])+\'">\'+esc(x[0])+\'</option>\').join("")+\'<option value="__manual__">Otro / escribir manualmente</option>\';if(preserve&&list.some(x=>x[0]===preserve))el.value=preserve;else if(preserve&&!list.length){el.value="__manual__";const m=document.getElementById(manualId);if(m){m.value=preserve;m.parentElement.style.display="block";}}else if(!list.length){el.value="__manual__";const m=document.getElementById(manualId);if(m)m.parentElement.style.display="block";}el.onchange=function(){const m=document.getElementById(manualId);if(m)m.parentElement.style.display=el.value==="__manual__"?"block":"none";};}\nfunction modelData(make){return vehicleCatalog[make]||[];}',1)
              # Add an Add Vehicle button to the customer header.
              old='</div><div class="actions" style="margin-top:0"><button onclick="editCustomer(\\\''+"'+id+'"+'\\\')">✏️ Editar cliente</button>'
              # More robust: inject just before the edit button in the rendered header.
              s=s.replace('<div class="actions" style="margin-top:0"><button onclick="editCustomer(\\\''+"'+id+'"+'\\\')">✏️ Editar cliente</button>','<div class="actions" style="margin-top:0"><button class="success" onclick="addVehicleToCustomer(\\\''+"'+id+'"+'\\\')">➕ Agregar vehículo</button><button onclick="editCustomer(\\\''+"'+id+'"+'\\\')">✏️ Editar cliente</button>',1)
              insert='''\nfunction addVehicleToCustomer(customerId){\n const c=customer(customerId);if(!c)return;\n customerDetail.innerHTML='<h3>➕ Agregar vehículo a '+esc(c.name)+'</h3><div class="notice">Este vehículo quedará registrado bajo el mismo cliente. Si después tiene OTs con cobro, su historial quedará protegido.</div><div class="grid g3"><div><label>Placa *</label><input id="addVPlate"></div><div><label>Marca</label><select id="addVMake" onchange="populateVehicleModels(\\\'addVMake\\\',\\\'addVModel\\\',\\\'addVYear\\');populateVehicleEngines(\\\'addVMake\\\',\\\'addVModel\\\',\\\'addVYear\\',\\\'addVEngine\\\',\\\'addVEngineManual\\\')"></select></div><div><label>Modelo</label><select id="addVModel" onchange="populateVehicleYears(\\\'addVMake\\\',\\\'addVModel\\\',\\\'addVYear\\');populateVehicleEngines(\\\'addVMake\\\',\\\'addVModel\\\',\\\'addVYear\\',\\\'addVEngine\\\',\\\'addVEngineManual\\\')" disabled><option value="">Seleccione modelo...</option></select></div><div><label>Año</label><select id="addVYear" onchange="populateVehicleEngines(\\\'addVMake\\\',\\\'addVModel\\\',\\\'addVYear\\',\\\'addVEngine\\\',\\\'addVEngineManual\\\')" disabled><option value="">Seleccione año...</option></select></div><div><label>Motor</label><select id="addVEngine"><option value="">Seleccione motor...</option></select></div><div><label>Color</label><input id="addVColor"></div><div><label>Kilometraje</label><input id="addVKm" type="number" min="0" value="0"></div></div><div class="actions"><button class="success" onclick="saveAddedVehicle(\\\''+customerId+'\\\')">💾 Guardar vehículo</button><button class="secondary" onclick="openCustomer(\\\''+customerId+'\\\')">Cancelar</button></div>';
 setTimeout(function(){populateMakeOptions("addVMake");ensureVehicleManualFields("addV");},0);\n}\nfunction populateMakeOptions(id){const el=document.getElementById(id);if(!el)return;el.innerHTML='<option value="">Seleccione marca...</option>'+Object.keys(vehicleCatalog).sort().map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join("")+'<option value="__manual__">Otra marca / escribir manualmente</option>';el.onchange=function(){const w=document.getElementById(id+"ManualWrap");if(w)w.style.display=el.value==="__manual__"?"block":"none";};}\nfunction saveAddedVehicle(customerId){const plate=document.getElementById("addVPlate").value.trim().toUpperCase(),make=fieldValue("addVMake","addVMakeManual"),model=fieldValue("addVModel","addVModelManual"),year=fieldValue("addVYear","addVYearManual"),engine=document.getElementById("addVEngine").value==="__manual__"?document.getElementById("addVEngineManual").value.trim():document.getElementById("addVEngine").value;if(!plate)return alert("La placa es obligatoria.");if(db.vehicles.some(v=>String(v.plate||"").toUpperCase()===plate))return alert("Esa placa ya existe.");if(!make||!model||!year)return alert("Marca, modelo y año son obligatorios. Puede usar la opción manual.");if(!engine)return alert("Debe indicar el motor o escribirlo manualmente.");db.vehicles.push({id:"v"+Date.now(),customerId,plate,make,model,year,engine,color:document.getElementById("addVColor").value.trim(),km:Number(document.getElementById("addVKm").value||0),active:true,createdAt:new Date().toISOString()});save();openCustomer(customerId);}\n'''
              s=s.replace('function closeCustomerDetail(){',insert+'\nfunction closeCustomerDetail(){',1)
              # Extend existing saveCustomer to respect manual values.
              s=s.replace('make:cMake.value.trim(),model:cModel.value.trim(),year:cYear.value,engine:cEngine.value.trim()','make:fieldValue("cMake","cMakeManual"),model:fieldValue("cModel","cModelManual"),year:fieldValue("cYear","cYearManual"),engine:(cEngine.value==="__manual__"?document.getElementById("cEngineManual").value.trim():cEngine.value)',1)
              # Add a safe engine selector enhancement for the existing registration form.
              s=s.replace('function saveCustomer(){','function initVehicleCatalogUI(){populateMakeOptions("cMake");ensureVehicleManualFields("c");const m=document.getElementById("cMake"),mo=document.getElementById("cModel"),y=document.getElementById("cYear");if(m)m.onchange=function(){populateVehicleModels("cMake","cModel","cYear");populateVehicleEngines("cMake","cModel","cYear","cEngine","cEngineManual")};if(mo)mo.onchange=function(){populateVehicleYears("cMake","cModel","cYear");populateVehicleEngines("cMake","cModel","cYear","cEngine","cEngineManual")};if(y)y.onchange=function(){populateVehicleEngines("cMake","cModel","cYear","cEngine","cEngineManual")};populateVehicleEngines("cMake","cModel","cYear","cEngine","cEngineManual");}\nfunction saveCustomer(){',1)
              # Ensure initialization happens once DOM is ready.
              s=s.replace('renderCustomers();','renderCustomers();try{initVehicleCatalogUI();}catch(e){}',1)
              # Update edit vehicle save to support manual values and engine catalog.
              s=s.replace('v.make=document.getElementById("editVMake").value.trim();v.model=document.getElementById("editVModel").value.trim();v.year=document.getElementById("editVYear").value;v.engine=document.getElementById("editVEngine").value.trim();','v.make=fieldValue("editVMake","editVMakeManual");v.model=fieldValue("editVModel","editVModelManual");v.year=fieldValue("editVYear","editVYearManual");v.engine=(document.getElementById("editVEngine").value==="__manual__"?document.getElementById("editVEngineManual").value.trim():document.getElementById("editVEngine").value);',1)
              # Enhance edit vehicle after its HTML is created.
              s=s.replace('setTimeout(()=>{document.getElementById("editVMake").value=v.make||"";populateVehicleModels("editVMake","editVModel","editVYear",v.model||"",v.year||"");},0);','setTimeout(()=>{populateMakeOptions("editVMake");document.getElementById("editVMake").value=v.make||"";ensureVehicleManualFields("editV");populateVehicleModels("editVMake","editVModel","editVYear",v.model||"",v.year||"");populateVehicleEngines("editVMake","editVModel","editVYear","editVEngine","editVEngineManual",v.engine||"");},0);',1)
              # Update customer vehicle card to show engine and add button remains in header.
          p.write_text(s,encoding='utf-8')
          assert 'function addVehicleToCustomer' in s
          assert 'vehicleEngineCatalog' in s
          assert 'function initVehicleCatalogUI' in s
          assert 'backups' not in s
      - name: Verificar sintaxis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<script>')==s.count('</script>')
          for token in ['function addVehicleToCustomer','function saveAddedVehicle','vehicleEngineCatalog','function initVehicleCatalogUI','function ensureVehicleManualFields']:
              assert token in s, token
          print('OK')
          PY
      - name: Guardar cambio y limpiar workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backups .github/smf-clientes-vehiculos.trigger
