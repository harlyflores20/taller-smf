name: SMF - Clientes y vehiculos
on:
  push:
    branches: [main]
    paths:
      - .github/smf-clientes-vehiculos.trigger
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Respaldar y actualizar index
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          import re, shutil
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          backup=Path('backups')/('index-pre-clientes-vehiculos-'+datetime.utcnow().strftime('%Y%m%d-%H%M%S')+'.html')
          backup.parent.mkdir(exist_ok=True)
          shutil.copy2(p,backup)
          if 'function addVehicleToCustomer' not in s:
              # Catalogo adicional de motores y marcas/modelos comunes; el campo manual siempre queda disponible.
              marker='function modelData(make){return vehicleCatalog[make]||[];}'
