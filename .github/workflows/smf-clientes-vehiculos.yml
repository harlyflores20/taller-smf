Wingle 5",2006,2026],["Wingle 7",2018,2026],["Poer",2020,2026]],\n  JAC:[["J4",2013,2022],["J7",2019,2026],["T8",2018,2026],["T9",2023,2026]],\n  BYD:[["Dolphin",2021,2026],["Han",2020,2026],["Song Plus",2020,2026],["Yuan Plus",2022,2026]],\n  MG:[["MG3",2011,2026],["ZS",2017,2026],["HS",2018,2026],["RX5",2016,2026]]\n};\nObject.keys(extraVehicleCatalog).forEach(function(k){ if(!vehicleCatalog[k])vehicleCatalog[k]=extraVehicleCatalog[k]; });\nconst vehicleEngineCatalog={\n  "Toyota|Corolla":[["1.8L 2ZR-FE",2008,2019],["1.8L 2ZR-FXE Hybrid",2019,2026],["2.0L M20A-FKS",2019,2026]],\n  "Toyota|Hilux":[["2.4L 2GD-FTV Diesel",2015,2026],["2.8L 1GD-FTV Diesel",2015,2026],["2.7L 2TR-FE",2005,2026],["4.0L 1GR-FE",2005,2015]],\n  "Toyota|Fortuner":[["2.4L 2GD-FTV Diesel",2015,2026],["2.8L 1GD-FTV Diesel",2015,2026],["2.7L 2TR-FE",2005,2026],["4.0L 1GR-FE",2005,2015]],\n  "Toyota|RAV4":[["2.0L 3ZR-FAE",2013,2018],["2.5L 2AR-FE",2013,2018],["2.5L A25A-FKS",2019,2026],["2.5L Hybrid A25A-FXS",2019,2026]],\n  "Toyota|4Runner":[["4.0L 1GR-FE V6",2003,2026],["4.7L 2UZ-FE V8",2003,2009]],\n  "Toyota|Land Cruiser":[["4.7L 2UZ-FE V8",1998,2007],["4.6L 1UR-FE V8",2008,2021],["3.5L V6 Twin Turbo",2022,2026],["4.5L 1VD-FTV Diesel",2007,2021]],\n  "Toyota|Prado":[["2.7L 2TR-FE",2003,2026],["4.0L 1GR-FE",2003,2023],["3.0L 1KD-FTV Diesel",2003,2015],["2.8L 1GD-FTV Diesel",2015,2026]],\n  "Toyota|Yaris":[["1.3L 2NZ-FE",2000,2011],["1.5L 1NZ-FE",2000,2018],["1.5L 2NR-FE",2019,2026]],\n  "Toyota|Tacoma":[["2.7L 2TR-FE",2005,2015],["4.0L 1GR-FE",2005,2015],["3.5L 2GR-FKS",2016,2023]],\n  "Honda|Civic":[["1.7L D17A",2001,2005],["1.8L R18A",2006,2015],["2.0L K20C2",2016,2026],["1.5L L15B Turbo",2016,2026]],\n  "Honda|CR-V":[["2.0L K20A",1997,2006],["2.4L K24A",2002,2011],["2.4L K24Z",2012,2016],["2.4L K24W",2015,2019],["1.5L L15B Turbo",2017,2026]],\n  "Honda|HR-V":[["1.8L R18Z",2015,2022],["1.5L L15B",2022,2026]],\n  "Honda|Pilot":[["3.5L J35A",2003,2015],["3.5L J35Y",2016,2022],["3.5L J35Y V6",