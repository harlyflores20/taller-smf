name: SMF temporary edit
on:
  push:
    paths:
      - .github/workflows/smf-temp-edit.yml
permissions:
  contents: write
jobs:
  edit-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          helper = '''function returnToPendingFromEvidence(id){
           const o=db.orders.find(function(x){return x.id===id;});if(!o)return;
           if(!confirm("¿Regresar esta OT a Pendientes? La aprobación actual quedará abierta para revisar nuevamente la cotización."))return;
           o.budget=o.budget||{};
           o.budget.status="Enviado";
           delete o.budget.approvedAt;
           delete o.budget.customerResponse;
           o.budget.locked=false;
           o.status="Esperando aprobación";
           o.workflowStage="pendientes";
           o.finalizationPending=false;
           o.ready=false;
           delete o.finalInspection;
           delete o.readyNotified;
           delete o.readyNotifiedAt;
           save();
           show("pendientes");
           renderPending();
          }
          '''
          if 'function returnToPendingFromEvidence(id)' not in s:
              marker = 'function openFinalization(id){'
              if marker not in s:
                  raise SystemExit('No se encontró la función de Evidencia en index.html')
              s = s.replace(marker, helper + marker, 1)
          old = r'''<button class="success" onclick="openFinalization(\''+o.id+'\')">📸 Subir evidencia</button>'''
          new = r'''<div class="actions" style="margin-top:0"><button class="secondary" onclick="returnToPendingFromEvidence(\''+o.id+'\')">↩ Regresar a Pendientes</button><button class="success" onclick="openFinalization(\''+o.id+'\')">📸 Subir evidencia</button></div>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'returnToPendingFromEvidence' not in s:
              raise SystemExit('No se encontró el botón de Evidencia esperado')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/smf-temp-edit.yml
          git rm .github/workflows/smf-temp-edit.yml
          git commit -m "Permitir regresar OT de Evidencia a Pendientes"
          git push