name: SMF - aplicar eliminacion segura
on:
  push:
    paths:
      - .github/smf-delete-trigger.txt
      - .github/workflows/smf-delete-trigger.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'function smfHasPaidHistoryForVehicle' in s:
              raise SystemExit(0)
          a=re.compile(r'function openCustomer\(id\)\{.*?\n\}\nfunction customerVehicleCard',re.S)
          b=r'''function openCustomer(id){
  const c=customer(id);if(!c)return;const vs=db.vehicles.filter(v=>v.customerId===id);customerDetail.classList.remove("hidden");
  customerDetail.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>👤 '+esc(c.name)+'</h3><div class="muted">'+esc(c.type||"Persona")+' · '+esc(c.phone)+(c.rtn?' · RTN '+esc(c.rtn):"")+'</div></div><div class="actions" style="margin-top:0"><button onclick="editCustomer(\''+id+'\')">✏️ Editar cliente</button>'+(role()==="Gerente"?'<button class="danger" onclick="deleteCustomer(\''+id+'\')">🗑️ Eliminar cliente</button>':'')+'<button class="secondary" onclick="closeCustomerDetail()">Cerrar</button></div></div><div class="card" style="margin-top:12px"><h3>🚗 Vehículos ('+vs.length+')</h3>'+(vs.length?vs.map(function(v){return customerVehicleCard(c,v);}).join(""):'<div class="muted">Este cliente no tiene vehículos registrados.</div>')+'</div>';
}
function customerVehicleCard'''
          if not a.search(s): raise SystemExit('openCustomer no encontrado')
          s=a.sub(b,s,1)
          a=re.compile(r'function customerVehicleCard\(c,v\)\{.*?\n\}\nfunction closeCustomerDetail',re.S)
          b=r'''function customerVehicleCard(c,v){
  const os=db.orders.filter(function(o){return o.vehicleId===v.id;});
  return '<div id="vehicleDetail_'+v.id+'" class="card" style="border-left:4px solid '+(v.active===false?"var(--muted)":"var(--brand)")+'"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>🚗 '+esc(v.plate)+'</h3><div>'+esc(v.make)+' '+esc(v.model)+' '+esc(v.year)+' · '+esc(v.engine||"Motor no registrado")+'</div><div class="muted">'+Number(v.km||0).toLocaleString()+' km · '+(v.active===false?"Inactivo":"Activo")+'</div></div><div class="actions" style="margin-top:0"><button onclick="editVehicle(\''+v.id+'\')">✏️ Editar</button><button class="secondary" onclick="openVehicleHistory(\''+v.id+'\')">📋 Historial ('+os.length+')</button><button class="light" onclick="changeVehicleOwner(\''+v.id+'\')">🔄 Propietario</button><button class="'+(v.active===false?"success":"danger")+'" onclick="toggleVehicle(\''+v.id+'\')">'+(v.active===false?"Activar":"Inactivar")+'</button>'+(role()==="Gerente"?'<button class="danger" onclick="deleteVehicle(\''+v.id+'\')">🗑️ Eliminar</button>':'')+'</div></div></div>';
}
function closeCustomerDetail'''
          if not a.search(s): raise SystemExit('customerVehicleCard no encontrado')
          s=a.sub(b,s,1)
          old='function deleteCustomer(id){archiveCustomer(id);}'
          new=r'''function smfHasPaidHistoryForVehicle(vehicleId){
  return db.orders.some(function(o){if(o.vehicleId!==vehicleId)return false;return o.paid===true||!!o.paidAt||Number(o.paymentReceived||0)>0;});
}
function smfPaidOrdersForCustomer(customerId){
  const ids=new Set(db.vehicles.filter(function(v){return v.customerId===customerId;}).map(function(v){return v.id;}));
  return db.orders.filter(function(o){if(!ids.has(o.vehicleId))return false;return o.paid===true||!!o.paidAt||Number(o.paymentReceived||0)>0;});
}
function deleteVehicle(id){
  if(role()!=="Gerente"){alert("Solo el Gerente puede eliminar vehículos.");return;}
  const v=vehicle(id);if(!v)return;
  if(smfHasPaidHistoryForVehicle(id)){alert("Este vehículo tiene historial completo con cobros registrados. No se puede eliminar. El historial debe conservarse.");return;}
  const c=customer(v.customerId);
  if(!confirm("¿Eliminar definitivamente el vehículo "+(v.plate||"")+"?\n\nComo no tiene ningún cobro registrado, se puede eliminar. Las órdenes sin pago asociadas también se eliminarán. Esta acción no se puede deshacer."))return;
  db.orders=db.orders.filter(function(o){return o.vehicleId!==id;});
  db.vehicles=db.vehicles.filter(function(x){return x.id!==id;});
  save();
  if(c)openCustomer(c.id);else closeCustomerDetail();
  renderCustomers();
}
function deleteCustomer(id){
  if(role()!=="Gerente"){alert("Solo el Gerente puede eliminar clientes.");return;}
  const c=customer(id);if(!c)return;
  const vs=db.vehicles.filter(function(v){return v.customerId===id;});
  const paid=smfPaidOrdersForCustomer(id);
  if(paid.length){alert("Este cliente tiene historial completo con cobros registrados. No se puede eliminar. El historial y las órdenes pagadas deben conservarse.");return;}
  if(!confirm("¿Eliminar definitivamente a "+(c.name||"este cliente")+"?\n\nNo tiene cobros registrados. También se eliminarán sus vehículos y las órdenes sin pago asociadas. Esta acción no se puede deshacer."))return;
  const vehicleIds=new Set(vs.map(function(v){return v.id;}));
  db.orders=db.orders.filter(function(o){return !vehicleIds.has(o.vehicleId);});
  db.vehicles=db.vehicles.filter(function(v){return v.customerId!==id;});
  db.customers=db.customers.filter(function(x){return x.id!==id;});
  save();customerDetail.classList.add("hidden");customerDetail.innerHTML="";renderCustomers();
}
'''
          if old not in s: raise SystemExit('deleteCustomer anterior no encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'function deleteVehicle' in s
          assert 'function deleteCustomer' in s
          assert 'paidAt' in s and 'paymentReceived' in s
          PY
      - name: Commit y limpiar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar eliminacion segura de clientes y vehiculos"
          git push
          git rm -f .github/workflows/smf-delete-trigger.yml .github/smf-delete-trigger.txt
          git commit -m "Limpiar archivos temporales de clientes"
          git push
