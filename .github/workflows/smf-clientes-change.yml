name: SMF - Clientes seguro

on:
  push:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Respaldar y modificar index
        shell: python
        run: |
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'function smfHasPaidHistoryForVehicle' in s:
              print('El cambio ya esta aplicado.')
              raise SystemExit(0)

          backup = Path('respaldos')
          backup.mkdir(exist_ok=True)
          stamp = datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S')
          (backup / f'index_{stamp}_antes_clientes.html').write_text(s, encoding='utf-8')

          open_pat = re.compile(r'function openCustomer\(id\)\{.*?\n\}\nfunction customerVehicleCard', re.S)
          open_rep = r'''function openCustomer(id){
            const c=customer(id);if(!c)return;const vs=db.vehicles.filter(v=>v.customerId===id);customerDetail.classList.remove("hidden");
            customerDetail.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>👤 '+esc(c.name)+'</h3><div class="muted">'+esc(c.type||"Persona")+' · '+esc(c.phone)+(c.rtn?' · RTN '+esc(c.rtn):"")+'</div></div><div class="actions" style="margin-top:0"><button onclick="editCustomer(\\''+id+'\\')">✏️ Editar cliente</button><button class="danger" onclick="deleteCustomer(\\''+id+'\\')">🗑️ Eliminar cliente</button><button class="secondary" onclick="closeCustomerDetail()">Cerrar</button></div></div><div class="card" style="margin-top:12px"><h3>🚗 Vehículos ('+vs.length+')</h3>'+(vs.length?vs.map(function(v){return customerVehicleCard(c,v);}).join(""):'<div class="muted">Este cliente no tiene vehículos registrados.</div>')+'</div>';
          }
          function customerVehicleCard'''
          if not open_pat.search(s):
              raise SystemExit('No se encontro openCustomer; no se modifico index.html')
          s = open_pat.sub(open_rep, s, count=1)

          veh_pat = re.compile(r'function customerVehicleCard\(c,v\)\{.*?\n\}\nfunction closeCustomerDetail', re.S)
          veh_rep = r'''function customerVehicleCard(c,v){
            const os=db.orders.filter(function(o){return o.vehicleId===v.id;});
            const protectedHistory=smfHasPaidHistoryForVehicle(v.id);
            return '<div id="vehicleDetail_'+v.id+'" class="card" style="border-left:4px solid '+(v.active===false?"var(--muted)":"var(--brand)")+'"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>🚗 '+esc(v.plate)+'</h3><div>'+esc(v.make)+' '+esc(v.model)+' '+esc(v.year)+' · '+esc(v.engine||"Motor no registrado")+'</div><div class="muted">'+Number(v.km||0).toLocaleString()+' km · '+(v.active===false?"Inactivo":"Activo")+'</div>'+(protectedHistory?'<div class="notice" style="margin-top:8px">🔒 Vehículo protegido: tiene historial con cobro. Se puede cambiar de propietario, pero no eliminar.</div>':'')+'</div><div class="actions" style="margin-top:0"><button onclick="editVehicle(\\''+v.id+'\\')">✏️ Editar</button><button class="secondary" onclick="openVehicleHistory(\\''+v.id+'\\')">📋 Historial ('+os.length+')</button><button class="light" onclick="changeVehicleOwner(\\''+v.id+'\\')">🔄 Propietario</button><button class="'+(v.active===false?"success":"danger")+'" onclick="toggleVehicle(\\''+v.id+'\\')">'+(v.active===false?"Activar":"Inactivar")+'</button><button class="danger" onclick="deleteVehicle(\\''+v.id+'\\')"'+(protectedHistory?' disabled title="Tiene historial cobrado"':'')+'>🗑️ Eliminar</button></div></div></div>';
          }
          function closeCustomerDetail'''
          if not veh_pat.search(s):
              raise SystemExit('No se encontro customerVehicleCard; no se modifico index.html')
          s = veh_pat.sub(veh_rep, s, count=1)

          old = 'function deleteCustomer(id){archiveCustomer(id);}'
          if old not in s:
              raise SystemExit('No se encontro deleteCustomer anterior; no se modifico index.html')

          new = r'''function smfHasPaidHistoryForVehicle(vehicleId){
            return db.orders.some(function(o){
              if(o.vehicleId!==vehicleId)return false;
              return o.paid===true||!!o.paidAt||Number(o.paymentReceived||0)>0;
            });
          }
          function smfPaidOrdersForCustomer(customerId){
            const ids=new Set(db.vehicles.filter(function(v){return v.customerId===customerId;}).map(function(v){return v.id;}));
            return db.orders.filter(function(o){
              if(!ids.has(o.vehicleId))return false;
              return o.paid===true||!!o.paidAt||Number(o.paymentReceived||0)>0;
            });
          }
          function deleteVehicle(id){
            const v=vehicle(id);if(!v)return;
            if(smfHasPaidHistoryForVehicle(id)){
              alert("Este vehículo tiene una OT con cobro registrado. No se puede eliminar. Puede cambiar de propietario y conservará todo su historial.");
              return;
            }
            const c=customer(v.customerId);
            if(!confirm("¿Eliminar definitivamente el vehículo "+(v.plate||"")+"?\\n\\nNo tiene ninguna OT con cobro registrado. Se eliminarán también sus OTs sin cobro. Esta acción no se puede deshacer."))return;
            db.orders=db.orders.filter(function(o){return o.vehicleId!==id;});
            db.vehicles=db.vehicles.filter(function(x){return x.id!==id;});
            save();
            if(c)openCustomer(c.id);else closeCustomerDetail();
            renderCustomers();
          }
          function deleteCustomer(id){
            const c=customer(id);if(!c)return;
            const vs=db.vehicles.filter(function(v){return v.customerId===id;});
            if(smfPaidOrdersForCustomer(id).length){
              alert("Este cliente tiene historial con cobros registrados. No se puede eliminar. Los vehículos con historial solo pueden cambiar de propietario.");
              return;
            }
            if(!confirm("¿Eliminar definitivamente a "+(c.name||"este cliente")+"?\\n\\nNinguno de sus vehículos tiene OTs con cobro registrado. Se eliminarán sus vehículos y las OTs sin cobro. Esta acción no se puede deshacer."))return;
            const vehicleIds=new Set(vs.map(function(v){return v.id;}));
            db.orders=db.orders.filter(function(o){return !vehicleIds.has(o.vehicleId);});
            db.vehicles=db.vehicles.filter(function(v){return v.customerId!==id;});
            db.customers=db.customers.filter(function(x){return x.id!==id;});
            save();
            customerDetail.classList.add("hidden");
            customerDetail.innerHTML="";
            renderCustomers();
          }
          '''
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Cambio aplicado y respaldo creado:', backup / f'index_{stamp}_antes_clientes.html')

      - name: Validar
        run: |
          test -s index.html
          grep -q 'function smfHasPaidHistoryForVehicle' index.html
          grep -q 'function deleteVehicle' index.html
          grep -q 'function deleteCustomer' index.html
          test -d respaldos
          echo 'VALIDACION OK'

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html respaldos
          git commit -m "Clientes: eliminar solo sin historial cobrado"
          git push
