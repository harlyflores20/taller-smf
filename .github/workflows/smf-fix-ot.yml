name: SMF fix OT
on:
  push:
    paths:
      - .github/workflows/smf-fix-ot.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          helper=r'''
<script>
(function(){
  function smfToast(msg){
    let t=document.getElementById('smfToast');
    if(!t){t=document.createElement('div');t.id='smfToast';t.style.cssText='position:fixed;right:22px;bottom:22px;z-index:99999;background:#15803d;color:#fff;padding:14px 18px;border-radius:10px;box-shadow:0 8px 30px #0004;font-weight:800';document.body.appendChild(t)}
    t.textContent=msg;t.style.display='block';clearTimeout(window.__smfToastTimer);window.__smfToastTimer=setTimeout(function(){t.style.display='none'},2600);
  }
  window.smfReturnDiagnosisToNew=function(){
    var n=(document.getElementById('smfReturnOTNumber')||{}).value||'';n=n.trim();
    if(!n){alert('Ingrese el número de OT.');return}
    var o=(window.db&&db.orders||[]).find(function(x){return String(x.orderNumber||'')===n});
    if(!o){alert('No se encontró la OT #'+n+'.');return}
    if(!confirm('¿Regresar la OT #'+n+' a Nueva Orden? Se conservarán el cliente y vehículo para corregir los datos de ingreso.'))return;
    o.workflowStage='nuevaOrden';
    o.status='Nueva orden';
    o.diagnosisOnly=false;
    delete o.diagnosis;
    delete o.diagnosisAt;
    delete o.diagnosisTechnicianId;
    delete o.diagnosisTechnicianName;
    if(typeof save==='function')save();
    smfToast('OT #'+n+' regresada a Nueva Orden');
    if(typeof show==='function')show('nuevaOrden');
    if(typeof renderNewOrder==='function')renderNewOrder();
    else if(typeof renderOrders==='function')renderOrders();
  };
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b)return;
    var oc=b.getAttribute('onclick')||'';
    if(!/createOrder|saveOrder|guardarNuevaOrden|crearOrden/i.test(oc))return;
    if(b.dataset.smfBusy==='1'){e.preventDefault();e.stopImmediatePropagation();return}
    var before=(window.db&&db.orders||[]).length;b.dataset.smfBusy='1';b.disabled=true;
    setTimeout(function(){
      var after=(window.db&&db.orders||[]).length;
      if(after>before)smfToast('✅ OT creada con éxito');
      setTimeout(function(){b.disabled=false;b.dataset.smfBusy='';},800);
    },80);
  },true);
})();
</script>
'''
          if 'id="smfToast"' not in s:
              s=s.replace(marker,helper+'\n'+marker,1)
          # Add a safe correction panel at the top of Diagnóstico.
          sec=re.search(r'(<section[^>]+id=["\']diagnostico["\'][^>]*>)',s,re.I)
          if not sec:
              sec=re.search(r'(<section[^>]+id=["\']diagnosis["\'][^>]*>)',s,re.I)
          if not sec:
              raise SystemExit('No se encontro la ventana de Diagnostico')
          panel='''<div id="smfDiagnosisReturnPanel" class="card" style="border-left:4px solid #b45309"><h3>↩ Corregir ingreso de OT</h3><p class="muted">Si una OT fue ingresada incorrectamente, regresala a Nueva Orden para corregir los datos.</p><div class="actions" style="margin-top:8px"><input id="smfReturnOTNumber" placeholder="Número de OT" style="max-width:220px"><button class="secondary" onclick="smfReturnDiagnosisToNew()">↩ Regresar a Nueva Orden</button></div></div>'''
          if 'id="smfDiagnosisReturnPanel"' not in s:
              pos=sec.end();s=s[:pos]+panel+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/smf-fix-ot.yml
          git rm .github/workflows/smf-fix-ot.yml
          git commit -m "Corregir creacion de OT y regreso a Nueva Orden"
          git push